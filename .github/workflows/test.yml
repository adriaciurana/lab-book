name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Browser integration tests
        run: |
          # LAN and curated-library smoke tests require an operator-provided workspace.
          suites=(
            accounts-ui agent-layout agent-send-lock appearance board-workspace column-editor
            column-tasks demo-browser diagram-chat diagram-editor editor-agent environment-picker
            experiment-picker inline-board lifecycle-browser math-notes mobile my-agent
            nested-pages page-questions persistence proposal-destination-ui published-pages reader
            research-attachments research-hub research-polish research-stream-skill routes save-navigation
            search-controls sidebar-forms sidebar-resize skill-manager source-pdf-import upload-controls
            workspace-pages
          )
          status=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            timeout 60s xvfb-run -a env -u ELECTRON_RUN_AS_NODE ./node_modules/.bin/electron --no-sandbox "tests/$suite.cjs" || status=1
            echo "::endgroup::"
          done
          exit "$status"
