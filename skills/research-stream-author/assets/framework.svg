<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="figure-title figure-desc">
 <title id="figure-title">Research framework — schematic to adapt</title>
 <desc id="figure-desc">Inputs become patch tokens through a frozen encoder. A trainable component produces preserved, learned and optional token groups. A training-only objective evaluates the output. All components and dimensions must be verified for the actual project.</desc>
