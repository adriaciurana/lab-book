  <pattern id="report-patches" width="15" height="15" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="12" rx="2" fill="#d7e9f5" stroke="#7f9eb5" stroke-width=".7"/></pattern>
  <pattern id="report-tokens" width="13" height="13" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="10" height="10" rx="2" fill="#6c98c2"/></pattern>
 </defs>
